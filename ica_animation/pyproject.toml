[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ica-animation"
version = "1.1.0"
description = "Configurable black-background animations explaining blind source separation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<3.12",
  "scikit-learn>=1.4,<1.10", "PyYAML>=6,<7", "Pillow>=10,<13"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ica-animation = "ica_animation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ica_animation = ["locales/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
