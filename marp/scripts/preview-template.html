<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — Offline preview</title>
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#202124; }
body { font-family:Arial,sans-serif; }
#viewport { position:absolute; inset:0 0 48px; display:flex; justify-content:center; align-items:center; }
#stage { position:relative; width:960px; height:720px; flex-shrink:0; transform-origin:center; }
#stage section { position:absolute; inset:0; visibility:hidden; }
#stage section.active { visibility:visible; }
#toolbar { position:absolute; left:0; right:0; bottom:0; height:48px; display:flex; align-items:center; justify-content:center; gap:14px; color:#fff; background:#111; font-size:14px; }
button { color:#eee; border:1px solid #666; background:#303134; border-radius:4px; padding:5px 11px; cursor:pointer; font:inherit; }
#notes { display:none; position:absolute; right:16px; bottom:60px; width:min(520px,80vw); max-height:55vh; overflow:auto; box-sizing:border-box; padding:22px; color:#eee; background:rgba(24,24,24,.97); border:1px solid #666; border-radius:8px; white-space:pre-wrap; font-size:16px; line-height:1.5; }
#notes.visible { display:block; }
@media print { html,body {overflow:visible;background:#fff;height:auto;} #viewport {position:static;display:block;} #stage {width:960px;height:auto;transform:none !important;} #stage section {position:relative;visibility:visible;page-break-after:always;} #toolbar,#notes {display:none;} @page {size:10in 7.5in;margin:0;} }
{{THEME}}
</style>
</head>
<body>
<div id="viewport"><main id="stage">{{SLIDES}}</main></div>
<nav id="toolbar" aria-label="Presentation controls">
<button id="previous" type="button" title="Left arrow">Previous</button>
<span id="counter" aria-live="polite"></span>
<button id="next" type="button" title="Right arrow">Next</button>
<button id="toggle-notes" type="button" title="N">Notes</button>
<button id="fullscreen" type="button" title="F">Fullscreen</button>
</nav>
<aside id="notes" aria-label="Speaker notes"></aside>
<script>
'use strict';
const slides = Array.from(document.querySelectorAll('#stage section'));
const notes = {{NOTES}};
let currentSlide = Math.max(0, Math.min(slides.length - 1, (Number(location.hash.slice(1)) || 1) - 1));
function fitStage() {
  const scale = Math.min(window.innerWidth / 960, (window.innerHeight - 48) / 720);
  document.getElementById('stage').style.transform = `scale(${scale})`;
}
function showSlide(index) {
  currentSlide = Math.max(0, Math.min(slides.length - 1, index));
  slides.forEach((slide, position) => {
    if (position !== currentSlide) slide.querySelectorAll('video').forEach(video => video.pause());
  });
  slides.forEach((slide, position) => slide.classList.toggle('active', position === currentSlide));
  document.getElementById('counter').textContent = `${currentSlide + 1} / ${slides.length}`;
  document.getElementById('notes').textContent = notes[currentSlide] || 'No speaker notes.';
  document.getElementById('previous').disabled = currentSlide === 0;
  document.getElementById('next').disabled = currentSlide === slides.length - 1;
  history.replaceState(null, '', `#${currentSlide + 1}`);
}
function toggleNotes() {
  document.getElementById('notes').classList.toggle('visible');
}
async function toggleFullscreen() {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (error) { console.warn('Fullscreen is not available.', error); }
}
document.getElementById('previous').addEventListener('click', () => showSlide(currentSlide - 1));
document.getElementById('next').addEventListener('click', () => showSlide(currentSlide + 1));
document.getElementById('toggle-notes').addEventListener('click', toggleNotes);
document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
window.addEventListener('resize', fitStage);
window.addEventListener('keydown', event => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); showSlide(currentSlide + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(event.key)) { event.preventDefault(); showSlide(currentSlide - 1); }
  else if (event.key === 'Home') showSlide(0);
  else if (event.key === 'End') showSlide(slides.length - 1);
  else if (event.key.toLowerCase() === 'n') toggleNotes();
  else if (event.key.toLowerCase() === 'f') toggleFullscreen();
});
fitStage();
showSlide(currentSlide);
</script>
</body>
</html>
